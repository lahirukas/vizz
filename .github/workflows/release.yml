name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CARGO_BUILD_JOBS: 4

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      USE_SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p vizz-app

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/vizz.exe dist/

      - name: Upload unsigned build
        if: env.USE_SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: vizz-unsigned
          path: dist/vizz.exe

      - name: Sign with SignPath
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use SignPath result
        if: env.USE_SIGNPATH == 'true'
        shell: pwsh
        run: Copy-Item signed/vizz.exe dist/vizz.exe -Force

      - name: Sign with certificate file
        if: env.USE_SIGNPATH != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "vizz.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD /d "Vizz" /du "https://github.com/lahirukas/vizz" dist/vizz.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx

      - name: Verify signature
        if: env.USE_SIGNPATH == 'true' || env.HAS_PFX == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/vizz.exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') { throw "vizz.exe is not signed" }

      - name: Note unsigned build
        if: env.USE_SIGNPATH != 'true' && env.HAS_PFX != 'true'
        run: echo "::warning::No signing configured; publishing an unsigned build. See docs/CODE_SIGNING.md."

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $dir = "vizz-$version-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist/vizz.exe, README.md, LICENSE, CHANGELOG.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash | Out-File "$dir.zip.sha256" -Encoding ascii

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            vizz-*-windows-x64.zip
            vizz-*-windows-x64.zip.sha256
