[package]
name = "vizz-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "vizz"
path = "src/main.rs"

[dependencies]
vizz-dsp = { path = "../dsp" }
vizz-audio = { path = "../audio" }
hound = { version = "3", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
vizz-render = { path = "../render" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts", "software-renderer-path", "image-default-formats", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "3.0.12"

[dependencies.windows]
version = "0.61"
default-features = false
features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
